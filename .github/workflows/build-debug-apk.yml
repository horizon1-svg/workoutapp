name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # used once, only to save package-lock.json and the debug key back to the repository

concurrency:
  group: build-debug-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WA_VERSION_CODE: ${{ github.run_number }}
      WA_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Get the project files
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36 and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          python3 -m pip install --quiet pillow numpy

      - name: Run automated tests
        run: npm test

      - name: Build the web assets (www/)
        run: node build-www.js

      - name: Create the Android project
        run: npx cap add android

      - name: Apply WorkoutApp settings (icons, splash, portrait, debug signing)
        run: |
          python3 make-icons.py android/app/src/main/res logo.png
          node patch-android.js debug

      - name: Prepare the stable debug signing key
        run: |
          if [ ! -f wa-debug.keystore ]; then
            keytool -genkeypair -keystore wa-debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=Android Debug,O=Android,C=US" > /dev/null 2>&1
            echo "Created a new debug key (it is saved to the repository below)"
          fi
          echo "WA_DEBUG_KEYSTORE=$GITHUB_WORKSPACE/wa-debug.keystore" >> "$GITHUB_ENV"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Check the APK
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then echo "::error::The build finished but no APK was produced"; exit 1; fi
          mkdir -p dist
          cp "$APK" dist/WorkoutApp-debug.apk
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -n 1)
          "$AAPT2" dump badging dist/WorkoutApp-debug.apk | grep -E "^(package|application-label|launchable-activity|sdkVersion|targetSdkVersion)" || true
          ls -l dist
          echo "### Debug APK built" >> "$GITHUB_STEP_SUMMARY"
          echo "Download **WorkoutApp-debug-apk** from the Artifacts section at the bottom of this page." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        uses: actions/upload-artifact@v6
        with:
          name: WorkoutApp-debug-apk
          path: dist/WorkoutApp-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Save lockfile and debug key (first successful run only)
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json wa-debug.keystore
          if git diff --cached --quiet; then
            echo "Nothing new to save"
          else
            git commit -m "Save lockfile and debug signing key"
            git push || echo "::warning::Could not save the debug key to the repository. Each build will then use a different debug key, so a new APK cannot be installed over the old one."
          fi

      - name: Show diagnostics (only if something failed)
        if: failure()
        run: |
          echo "---- AndroidManifest.xml ----"; cat android/app/src/main/AndroidManifest.xml || true
          echo "---- end of app/build.gradle ----"; tail -n 60 android/app/build.gradle || true
          echo "---- res folders ----"; ls android/app/src/main/res || true

